name: astrbot_plugin_memory_diary
display_name: 记忆日记
short_desc: AI 自主写日记与交接信，reset 后延续共同经历与关系
desc: 让 AI 以第一人称记录与你的共同经历，而不只是建立用户画像。采用自传快照记忆：原始日记长期保存，当前交接信滚动更新，reset 后优先恢复当前关系、正在发生的事与未来叮嘱，需要时再通过本地证据搜索回源。支持自主写作与不写、显式记忆、非阻塞后台写作、轻量注入、记忆反思与确认、具体群隔离、外部素材吸收、签名验证、可选静态加密，以及可阅读的导出备份。
version: v0.7.0
author: mrzhsz3210
